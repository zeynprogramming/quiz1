<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1eee8">
  <title>Roadmap test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Noto+Sans+Armenian:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-trophy" viewBox="0 0 200 220">
      <path d="M46 42H34a16 16 0 0 0-16 16c0 24 14 38 36 42M154 42h12a16 16 0 0 1 16 16c0 24-14 38-36 42" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round"/>
      <path d="M52 24h96a6 6 0 0 1 6 6v34c0 38-22 62-44 68v30h22a8 8 0 0 1 8 8v14H60v-14a8 8 0 0 1 8-8h22v-30c-22-6-44-30-44-68V30a6 6 0 0 1 6-6z" fill="currentColor"/>
      <rect x="50" y="186" width="100" height="18" rx="6" fill="currentColor"/>
    </symbol>
  </svg>

  <header class="hud">
    <div class="hud-inner">
      <div class="brand">
        <span class="brand-mark"><svg><use href="#i-trophy"/></svg></span>
        <span class="brand-name">Roadmap test</span>
      </div>
      <a class="pill pill-link" id="home-link" hidden>Roadmap</a>
    </div>
    <div class="track" id="track-row" hidden>
      <div class="track-line" id="track" role="progressbar" aria-label="Questions answered" aria-valuemin="0" aria-valuenow="0">
        <span class="track-fill"><span class="runner"></span></span>
      </div>
      <span class="track-count" id="track-count"></span>
    </div>
  </header>

  <main class="quiz" id="quiz"></main>

  <noscript><p style="padding:24px;text-align:center">This test needs JavaScript.</p></noscript>
  <script src="seal.js"></script>
  <script src="questions.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
